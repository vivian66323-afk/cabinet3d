# Playwright 煙霧測試：push 到 main 與所有 PR 都跑。
# 只做測試，不碰部署；GitHub Pages 仍由原本的 Pages 設定（含 .nojekyll）自行發布。
name: 煙霧測試

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Playwright（Chromium）
    # 固定 24.04：ubuntu-latest 已換成 26.04，Playwright 1.56.1 不支援（裝不了 Chromium）。升級 Playwright 後可再改回 latest。
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安裝套件
        run: npm ci

      - name: 安裝 Chromium
        run: npx playwright install --with-deps chromium

      - name: Node 單元測試（報價／樓層／DXF 輸出）
        run: npm run test:unit

      - name: DXF 匯入測試
        run: npm run test:dxf

      - name: 執行測試
        run: npm test

      - name: 上傳測試報告（失敗時）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
